[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "volte-face"
version = "0.1.0"
description = "Detect expressed intent shifts between adjacent LLM responses using SubQ."
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "pydantic>=2.10,<3",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
include = ["volte_face*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
